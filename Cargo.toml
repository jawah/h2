[package]
name = "jh2"
version = "5.0.15"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "jh2"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.2", features = ["extension-module", "generate-import-lib"] }
httlib-hpack = { version = "0.1.3" }

[features]
default = ["abi3-py37"]
abi3-py37 = ["pyo3/abi3-py37"]
abi3-py311 = ["pyo3/abi3-py311"]

[build-dependencies]
pyo3-build-config = { version = "0.28.2", features = ["resolve-config"] }

[package.metadata.maturin]
python-source = "jh2"
